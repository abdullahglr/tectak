<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TECTAK - Yarışma Detayları">
  <title>TECTAK — Yarışma Detayları</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- App CSS -->
  <link rel="stylesheet" href="style.css?v=1.1">
  <style>
    .detail-container {
      max-width: 800px;
      margin: 120px auto 60px;
      padding: 0 24px;
    }
    .detail-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 32px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      margin-bottom: 24px;
      transition: var(--transition);
    }
    .back-btn:hover {
      color: var(--accent-blue);
    }
    .detail-header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 24px;
    }
    .detail-header h1 {
      font-size: 2rem;
      margin-top: 12px;
      color: var(--text-primary);
    }
    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .detail-meta div {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .detail-description {
      font-size: 1.1rem;
      color: var(--text-secondary);
      line-height: 1.8;
      margin-bottom: 32px;
    }
    .detail-map {
      height: 300px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      margin-bottom: 32px;
    }
    .detail-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--glass-border);
      padding-top: 24px;
    }
    .detail-prize {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-green);
    }
    
    .register-btn-large {
      padding: 14px 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent-blue), rgba(0,212,255,0.7));
      color: #000;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: var(--transition);
    }
    .register-btn-large:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0,212,255,0.4), 0 0 0 1px rgba(0,212,255,0.5);
    }
    .register-btn-large:active { transform: translateY(-1px) scale(0.98); }
    
    @media (max-width: 768px) {
      .detail-card {
        padding: 24px;
      }
      .detail-footer {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo-group">
        <img src="grafikbirleşenleri/LOGO.png" alt="TECTAK Logo">
        <span>TECTAK</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link active">Ana Sayfa</a>
      </nav>
    </div>
  </header>

  <!-- ===== DETAIL ===== -->
  <main class="detail-container">
    <a href="all_competitions.html" class="back-btn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Tüm Yarışmalara Dön
    </a>
    <div class="detail-card" id="detail-card">
      <div style="text-align:center; color: var(--text-muted); padding: 40px;">Yükleniyor...</div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container">
      <p><a href="https://www.linkedin.com/in/abdullah-g%C3%BCler-2a926b29b/" target="_blank" style="text-decoration:none; color:inherit;"><span class="gradient-text">TECTAK</span></a> — Teknoloji Takvimi © 2026</p>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">Abdullah GÜLER tarafından geliştirilmiştir.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="comp_detail.js"></script>
</body>
</html>
