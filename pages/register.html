<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECTAK — Ziyaretçi Başvurusu</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=4.0">
  <style>
    .register-container {
      max-width: 600px;
      margin: 120px auto 60px;
      padding: 0 24px;
    }
    .register-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 40px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      margin-bottom: 24px;
      transition: var(--transition);
    }
    .back-btn:hover {
      color: var(--accent-blue);
    }
    .register-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .register-header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .register-header p {
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 1rem;
      transition: var(--transition);
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.2);
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent-blue), rgba(0,212,255,0.7));
      color: #000;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: var(--transition);
      margin-top: 16px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,212,255,0.3);
    }
    .success-message {
      text-align: center;
      display: none;
    }
    .success-icon {
      font-size: 4rem;
      color: var(--accent-green);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header style="position:fixed;top:0;left:0;right:0;z-index:500;background:rgba(10,9,7,.96);backdrop-filter:blur(24px);border-bottom:1px solid rgba(205,198,190,.15);display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;">
    <a href="../index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
      <img src="../assets/images/LOGO.png" alt="TECTAK" style="height:20px;filter:invert(1);opacity:.8;">
      <span style="font-family:'EB Garamond',serif;font-size:22px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#e5e2e1;">TECTAK</span>
    </a>
    <a href="javascript:history.back()" style="display:flex;align-items:center;gap:8px;font-family:'Hanken Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#888;text-decoration:none;">
      ← Geri Dön
    </a>
  </header>

  <!-- ===== REGISTER FORM ===== -->
  <main class="register-container" style="margin-top: 100px;">
    <a href="#" id="back-link" class="back-btn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Detaylara Dön
    </a>
    
    <div class="register-card">
      <div id="form-content">
        <div class="register-header">
          <h1>Ziyaretçi Başvurusu</h1>
          <p id="event-name-display">Etkinlik bilgileri yükleniyor...</p>
        </div>
        
        <form id="registration-form">
          <div class="form-group">
            <label for="fullName">Ad Soyad</label>
            <input type="text" id="fullName" required placeholder="Örn: Ali Yılmaz">
          </div>
          
          <div class="form-group">
            <label for="email">E-posta Adresi</label>
            <input type="email" id="email" required placeholder="Örn: ali@example.com">
          </div>
          
          <div class="form-group">
            <label for="phone">Telefon Numarası</label>
            <input type="tel" id="phone" required placeholder="05XX XXX XX XX">
          </div>
          
          <div class="form-group">
            <label for="ticketType">Bilet / Katılım Tipi</label>
            <select id="ticketType" required>
              <option value="standart">Standart Ziyaretçi</option>
              <option value="ogrenci">Öğrenci</option>
              <option value="profesyonel">Sektör Profesyoneli</option>
            </select>
          </div>
          
          <button type="submit" class="submit-btn">Başvuruyu Tamamla</button>
        </form>
      </div>

      <div id="success-content" class="success-message">
        <div class="success-icon">✓</div>
        <h2>Başvurunuz Alındı!</h2>
        <p style="color: var(--text-muted); margin: 16px 0;">Biletiniz ve katılım detayları e-posta adresinize gönderilecektir.</p>
        <p id="success-event-name" style="font-weight: bold; margin-bottom: 24px; color: var(--accent-blue);"></p>
        <a href="../index.html" class="submit-btn" style="display: inline-block; text-decoration: none; text-align: center; width: auto; padding: 12px 32px;">Ana Sayfaya Dön</a>
      </div>
    </div>
  </main>

  <script src="../data/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = parseInt(urlParams.get('id'));
      
      const eventDataList = window.events || (typeof events !== 'undefined' ? events : []);
      const event = eventDataList.find(e => e.id === eventId);
      
      const backLink = document.getElementById('back-link');
      const eventNameDisplay = document.getElementById('event-name-display');
      const formContent = document.getElementById('form-content');
      const successContent = document.getElementById('success-content');
      const form = document.getElementById('registration-form');
      const successEventName = document.getElementById('success-event-name');
      
      if (!event) {
        eventNameDisplay.innerHTML = '<span style="color:var(--accent-red)">Etkinlik bulunamadı.</span>';
        form.style.display = 'none';
        backLink.href = '../index.html';
        return;
      }
      
      backLink.href = `event.html?id=${event.id}`;
      eventNameDisplay.textContent = event.title + ' etkinliği için kayıt formunu doldurun.';
      
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        // Here you would normally send data to a server
        
        formContent.style.display = 'none';
        successContent.style.display = 'block';
        successEventName.textContent = event.title;
      });
    });
  </script>
</body>
</html>
