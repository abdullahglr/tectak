<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECTAK — 3D Etkinlik Haritası</title>
  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <!-- Tectak Data -->
  <script src="data.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #030811;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 255, 204, 0.2);
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background: #00ffcc;
      color: #030811;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
    }
    .info-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(11, 25, 44, 0.8);
      border: 1px solid rgba(0, 255, 204, 0.2);
      padding: 15px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      max-width: 300px;
      pointer-events: none;
    }
    .info-panel h3 {
      margin: 0 0 5px 0;
      color: #00ffcc;
    }
    .info-panel p {
      margin: 0;
      font-size: 0.9rem;
      color: #a0aec0;
    }
    .maplibregl-popup-content {
      background: rgba(3, 8, 17, 0.95) !important;
      border: 1px solid #00ffcc;
      color: #fff;
      border-radius: 8px;
      padding: 15px;
      max-width: 300px;
      max-height: 400px;
      overflow-y: auto;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
    }
    .maplibregl-popup-tip {
      border-top-color: #00ffcc !important;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .event-item {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 0;
      opacity: 0;
      animation: fadeInUp 0.4s ease forwards;
    }
    .event-item:last-child {
      border-bottom: none;
    }
    .event-title {
      font-weight: bold;
      color: #00ffcc;
      margin-bottom: 5px;
      font-size: 0.95rem;
    }
    .event-date {
      font-size: 0.8rem;
      color: #a0aec0;
    }
    .detail-btn {
      display: inline-block;
      margin-top: 8px;
      background: #00ffcc;
      color: #030811;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .detail-btn:hover {
      background: #00cca3;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
    }
  </style>
</head>
<body>

  <button class="back-btn" onclick="window.location.href='index.html'">← Geri Dön</button>

  <div id="map"></div>

  <div class="info-panel">
    <h3>3D Etkinlik Haritası</h3>
    <p>Yakınlaştıkça büyük sütunlar **yumuşakça kaybolurken** küçük silindirler belirir ve dağılır.</p>
  </div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [35.5, 39.0],
      zoom: 5.5,
      pitch: 60,
      bearing: 0
    });

    const zoomThreshold = 8;

    function createHexagon(lng, lat, radiusDeg) {
      const coords = [];
      const steps = 6;
      for (let i = 0; i < steps; i++) {
        const angle = (i / steps) * Math.PI * 2;
        const x = lng + radiusDeg * Math.cos(angle);
        const y = lat + radiusDeg * Math.sin(angle);
        coords.push([x, y]);
      }
      coords.push(coords[0]);
      return [coords];
    }

    map.on('load', () => {
      const cityMap = {};

      if (typeof events !== 'undefined') {
        events.forEach(event => {
          if (event.lat && event.lng && event.city) {
            if (!cityMap[event.city]) {
              cityMap[event.city] = {
                lat: event.lat,
                lng: event.lng,
                events: []
              };
            }
            cityMap[event.city].events.push(event);
          }
        });
      }

      // 1. Aggregated Layer
      const aggFeatures = [];
      for (const city in cityMap) {
        const data = cityMap[city];
        const count = data.events.length;
        const poly = createHexagon(data.lng, data.lat, 0.03); 
        
        aggFeatures.push({
          type: 'Feature',
          geometry: {
            type: 'Polygon',
            coordinates: poly
          },
          properties: {
            city: city,
            count: count,
            height: count * 5000,
            eventsJson: JSON.stringify(data.events)
          }
        });
      }

      // 2. Individual Layer
      const indFeatures = [];
      const categoryColors = {
        'teknoloji': '#00ffcc',
        'bilisim': '#0088ff',
        'robotik': '#ffaa00',
        'savunma': '#ff3300',
        'elektrik-elektronik': '#cc00ff'
      };

      if (typeof events !== 'undefined') {
        events.forEach(event => {
          if (event.lat && event.lng) {
            const cityData = cityMap[event.city];
            const poly = createHexagon(cityData.lng, cityData.lat, 0.008); 
            
            indFeatures.push({
              type: 'Feature',
              geometry: {
                type: 'Polygon',
                coordinates: poly
              },
              properties: {
                title: event.title,
                city: event.city,
                date: event.date,
                id: event.id,
                height: 3000,
                color: categoryColors[event.category] || '#ffffff',
                actualLng: event.lng,
                actualLat: event.lat,
                startLng: cityData.lng,
                startLat: cityData.lat
              }
            });
          }
        });
      }

      map.addSource('agg-source', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: aggFeatures }
      });

      map.addSource('ind-source', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: indFeatures }
      });

      // Remove maxzoom/minzoom to handle opacity manually
      map.addLayer({
        'id': 'agg-columns',
        'type': 'fill-extrusion',
        'source': 'agg-source',
        'paint': {
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': 0,
          'fill-extrusion-color': '#00ffcc',
          'fill-extrusion-opacity': 0.8 // Initial opacity
        }
      });

      map.addLayer({
        'id': 'ind-columns',
        'type': 'fill-extrusion',
        'source': 'ind-source',
        'paint': {
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': 0,
          'fill-extrusion-color': ['get', 'color'],
          'fill-extrusion-opacity': 0 // Initial hidden
        }
      });

      let animated = false;
      
      map.on('zoom', () => {
        const zoom = map.getZoom();
        if (zoom >= zoomThreshold && !animated) {
          animated = true;
          animateSpread(true);
        } else if (zoom < zoomThreshold && animated) {
          animated = false;
          animateSpread(false);
        }
      });

      function animateSpread(out) {
        const startTime = Date.now();
        const duration = 1000; // 1 second for smoother feel
        
        function step() {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          
          const ease = progress < 0.5 
            ? 4 * progress * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 3) / 2;

          // Animate Opacity (Seamless Blend)
          const aggOpacity = out ? (1 - ease) : ease;
          const indOpacity = out ? ease : (1 - ease);
          
          map.setPaintProperty('agg-columns', 'fill-extrusion-opacity', aggOpacity * 0.8);
          map.setPaintProperty('ind-columns', 'fill-extrusion-opacity', indOpacity * 0.9);

          // Animate Coordinates
          const currentFeatures = indFeatures.map(f => {
            const startLng = f.properties.startLng;
            const startLat = f.properties.startLat;
            const targetLng = f.properties.actualLng;
            const targetLat = f.properties.actualLat;
            
            let currentLng, currentLat;
            
            if (out) {
              currentLng = startLng + (targetLng - startLng) * ease;
              currentLat = startLat + (targetLat - startLat) * ease;
            } else {
              currentLng = targetLng + (startLng - targetLng) * ease;
              currentLat = targetLat + (startLat - targetLat) * ease;
            }
            
            return {
              ...f,
              geometry: {
                type: 'Polygon',
                coordinates: createHexagon(currentLng, currentLat, 0.008)
              }
            };
          });
          
          const source = map.getSource('ind-source');
          if (source) {
            source.setData({
              type: 'FeatureCollection',
              features: currentFeatures
            });
          }
          
          if (progress < 1) {
            requestAnimationFrame(step);
          }
        }
        
        step();
      }

      // Popups
      map.on('click', 'agg-columns', (e) => {
        if (map.getPaintProperty('agg-columns', 'fill-extrusion-opacity') < 0.2) return; // Ignore if faded
        
        const props = e.features[0].properties;
        const cityEvents = JSON.parse(props.eventsJson);
        
        let html = `<h3 style="color:#fff; margin-bottom:10px;">${props.city} (${props.count} Etkinlik)</h3>`;
        
        cityEvents.forEach((ev, index) => {
          const delay = index * 0.1;
          html += `
            <div class="event-item" style="animation-delay: ${delay}s">
              <div class="event-title">${ev.title}</div>
              <div class="event-date">📅 ${ev.date}</div>
              <a href="event.html?id=${ev.id}" class="detail-btn" target="_blank">Detaylı Bilgi</a>
            </div>
          `;
        });

        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(html)
          .addTo(map);
      });

      map.on('click', 'ind-columns', (e) => {
        if (map.getPaintProperty('ind-columns', 'fill-extrusion-opacity') < 0.2) return; // Ignore if faded
        
        const props = e.features[0].properties;
        
        const html = `
          <div class="event-item" style="animation: none; opacity: 1;">
            <div class="event-title">${props.title}</div>
            <div class="event-date">📅 ${props.date}</div>
            <div style="color:#a0aec0; font-size:0.8rem; margin-top:5px;">📍 ${props.city}</div>
            <a href="event.html?id=${props.id}" class="detail-btn" target="_blank">Detaylı Bilgi</a>
          </div>
        `;

        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(html)
          .addTo(map);
      });

      map.on('mouseenter', 'agg-columns', () => { if (map.getPaintProperty('agg-columns', 'fill-extrusion-opacity') > 0.5) map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'agg-columns', () => { map.getCanvas().style.cursor = ''; });
      map.on('mouseenter', 'ind-columns', () => { if (map.getPaintProperty('ind-columns', 'fill-extrusion-opacity') > 0.5) map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'ind-columns', () => { map.getCanvas().style.cursor = ''; });
    });
  </script>
</body>
</html>
