name: Update Events Weekly

on:
  schedule:
    # Her hafta Pazartesi günü saat 00:00'da (UTC) çalışır
    - cron: '0 0 * * 1'
  workflow_dispatch: # Manuel olarak tetiklemeye de izin verir

jobs:
  update-events:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repoyu Klonla (Checkout)
        uses: actions/checkout@v3

      - name: Node.js Kurulumu
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Etkinlik Verilerini Çek (Fetch Events)
        run: node fetch_events.js

      - name: Değişiklikleri Kontrol Et ve Commit At
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add events.json
          # Eğer data.js dosyasını da güncelliyorsanız onu da ekleyebilirsiniz:
          # git add data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik Güncelleme: Haftalık etkinlik verisi yenilendi" && git push)
