name: Update Events Weekly

on:
  schedule:
    # Her hafta Pazartesi günü saat 03:00'da (UTC) çalışır
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Etkinlik Verilerini Çek
        run: node fetch_events.js

      - name: Tarih Bazlı registrationStatus Güncelle
        run: node update_status.js

      - name: Değişiklikleri Commit Et
        run: |
          git config --global user.name "TECTAK Bot"
          git config --global user.email "tectak-bot@github.com"
          git add events.json data.js news_data.js
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "🤖 Otomatik: Haftalık veri güncellemesi ($(date -u '+%Y-%m-%d'))"

      - name: Push
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Trigger GitHub Pages Build
        if: success()
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds

